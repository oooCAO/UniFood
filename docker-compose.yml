# Локальное окружение UniFood: веб-сервер с PHP, MySQL и MongoDB.
# Все имена баз и пароли берутся из .env, в этом файле секретов нет.
# Порты на хосте задаются переменными, чтобы можно было обойти занятые порты.

services:
  # PHP + Apache. Корень сайта — public/, исходники src/ лежат рядом.
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Слева порт на компьютере, справа — порт внутри контейнера (он всегда 80).
    ports:
      - "${WEB_PORT:-8080}:80"
    # Монтируем только папки с кодом: правки сразу видны в контейнере,
    # пересобирать образ при изменении PHP-файлов не нужно.
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      # bin/ и tests/ нужны и веб-контейнеру: скрипт импорта и его проверки
      # запускают вручную через docker compose exec web.
      - ./bin:/var/www/html/bin
      - ./tests:/var/www/html/tests
      - ./composer.json:/var/www/html/composer.json
      # Lock-файл монтируем отдельно: без него composer install внутри
      # контейнера резолвит зависимости заново и игнорирует зафиксированные версии.
      - ./composer.lock:/var/www/html/composer.lock
    # PHP читает настройки подключения из переменных окружения (src/config.php).
    # Значения собираем из .env, чтобы не дублировать пароли в нескольких местах.
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      MONGO_HOST: mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_NAME: "${MONGO_INITDB_DATABASE}"
      MONGO_USER: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    # Ждём запуска баз, чтобы health.php не падал на первом запросе.
    depends_on:
      - mysql
      - mongo

  # Ежедневный импорт меню market.grsu.by по расписанию.
  # Здесь нет веб-сервера: контейнер только держит cron и запускает PHP-скрипт.
  cron:
    build:
      # Тот же контекст, что у web, но отдельный Dockerfile.
      context: .
      dockerfile: docker/cron/Dockerfile
    # Скрипт импорта использует те же файлы проекта, что и сайт.
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./bin:/var/www/html/bin
      - ./tests:/var/www/html/tests
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
    # Подключения к базам те же, что у web: импорт пишет в MySQL,
    # а позже может понадобиться MongoDB.
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      MONGO_HOST: mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_NAME: "${MONGO_INITDB_DATABASE}"
      MONGO_USER: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    # Импорт должен дождаться баз, иначе первый запуск упадёт.
    depends_on:
      - mysql
      - mongo
    restart: unless-stopped
    # cron -f (Dockerfile CMD) не передаёт свои переменные окружения
    # заданиям, которые запускает по расписанию (у них своё, пустое
    # окружение) — поэтому перед запуском демона сохраняем DB_*/MONGO_*
    # в файл, который docker/cron/crontab подключает перед каждым php.
    # "export" обязателен: обычное "КЛЮЧ=значение" при подключении файла
    # через ". файл" задаёт переменную только в текущем shell и не передаёт
    # её дальше в php, который cron запускает отдельным процессом.
    command: >
      sh -c "env | grep -E '^(DB_|MONGO_)' | sed -E \"s/^([A-Z_]+)=(.*)$/export \\1='\\2'/\" > /etc/cron.d/unifood-env && cron -f"

  # MySQL 8: реляционные данные (пользователи, заказы, меню).
  mysql:
    image: mysql:8
    ports:
      # Снаружи порт можно поменять, внутри контейнера MySQL всегда слушает 3306.
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      # Слоты держатся только на "сегодня" (П.8): CURDATE()/CURTIME() внутри
      # MySQL должны считать время так же, как PHP и cron (оба — Europe/Minsk),
      # иначе "сегодня" в базе сдвигается по UTC в районе полуночи по Минску.
      TZ: Europe/Minsk
    volumes:
      # Данные храним в именованном томе, чтобы они не пропадали при перезапуске.
      - mysql_data:/var/lib/mysql
      # SQL-скрипты из этой папки MySQL выполняет один раз при пустой базе.
      - ./database/init:/docker-entrypoint-initdb.d:ro

  # MongoDB 7: нереляционные данные (например, отзывы и логи).
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      # При первом запуске образ создаёт root-пользователя и базу приложения.
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE}"
    volumes:
      - mongo_data:/data/db

# Именованные тома Docker хранит у себя, на диск проекта они не попадают.
volumes:
  mysql_data:
  mongo_data:
