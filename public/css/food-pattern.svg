<?xml version="1.0" encoding="UTF-8"?>
<!--
  Узор для фона страниц UniFood.

  Плитка 200×200 с силуэтами еды: кусок пиццы, напиток, яблоко и бургер.
  Цвет — фирменный зелёный с прозрачностью, чтобы узор не мешал читать текст.
  Файл подключается из style.css как background-image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    <g fill="#2f7d4f" fill-opacity="0.14">
        <!-- Кусок пиццы -->
        <rect x="20" y="18" width="38" height="6" rx="3"/>
        <path d="M22 24 h34 l-17 34 z"/>

        <!-- Напиток с трубочкой -->
        <path d="M132 26 h22 l-3 30 h-16 z"/>
        <path d="M138 26 l5 -12 h4 l-5 12 z"/>

        <!-- Яблоко с листиком -->
        <circle cx="46" cy="140" r="14"/>
        <rect x="44" y="118" width="3" height="10" rx="1.5"/>
        <path d="M47 124 q10 -10 17 -6 q-5 10 -17 6 z"/>

        <!-- Бургер -->
        <path d="M126 128 h44 a22 14 0 0 0 -44 0 z"/>
        <rect x="122" y="136" width="52" height="4" rx="2"/>
        <rect x="126" y="144" width="44" height="5" rx="2"/>
        <path d="M126 154 h44 a10 6 0 0 1 -10 6 h-24 a10 6 0 0 1 -10 -6 z"/>
    </g>
</svg>
