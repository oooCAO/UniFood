<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniFood — Точки питания</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__brand">
      <a class="site-header__logo" href="/">UniFood</a>
      <p class="site-header__tagline">Заказывай еду в университете заранее</p>
    </div>
    <nav class="site-header__nav">
      <a class="site-header__link" href="/orders/">Мой заказ</a>
      <a class="site-header__link site-header__link--login" href="/login/">Войти</a>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Точки питания</h2>

    <div class="locations-grid">

      <article class="location-card">
        <h3 class="location-card__name">Кафе «Главный корпус»</h3>
        <p class="location-card__place">Главный корпус, 1 этаж</p>
        <span class="badge badge--open">Открыто</span>
        <a class="btn" href="/locations/1">Открыть меню</a>
      </article>

      <article class="location-card">
        <h3 class="location-card__name">Столовая №2</h3>
        <p class="location-card__place">Корпус А, 2 этаж</p>
        <span class="badge badge--open">Открыто</span>
        <a class="btn" href="/locations/2">Открыть меню</a>
      </article>

      <article class="location-card location-card--closed">
        <h3 class="location-card__name">Буфет «Технический»</h3>
        <p class="location-card__place">Корпус Б, 1 этаж</p>
        <span class="badge badge--closed">Закрыто</span>
        <a class="btn" href="/locations/3">Открыть меню</a>
      </article>

    </div>
  </main>

  <footer class="site-footer">
    <p>UniFood © 2026 · ГрГУ им. Янки Купалы</p>
  </footer>

</body>
</html>
